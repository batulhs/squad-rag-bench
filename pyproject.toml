[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "Controlled comparison of four retrievers for RAG on SQuAD 2.0"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "accelerate>=0.26",
  "torch>=2.2",
  "openai>=1.30",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
